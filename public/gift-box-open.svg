<svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F1FB"/>
    </linearGradient>
    <linearGradient id="goLid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFDFF"/>
      <stop offset="1" stop-color="#D3E9FA"/>
    </linearGradient>
    <linearGradient id="goRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B6BFF"/>
      <stop offset="1" stop-color="#33A8DD"/>
    </linearGradient>
    <radialGradient id="goBurst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#33A8DD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#33A8DD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="214" rx="68" ry="11" fill="#030132" opacity="0.14"/>

  <!-- light burst behind -->
  <circle cx="120" cy="118" r="98" fill="url(#goBurst)"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="30" x2="120" y2="8"/>
    <line x1="70" y1="46" x2="54" y2="30"/>
    <line x1="170" y1="46" x2="186" y2="30"/>
    <line x1="46" y1="90" x2="24" y2="82"/>
    <line x1="194" y1="90" x2="216" y2="82"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFD43B">
    <circle cx="60" cy="60" r="4"/>
    <circle cx="188" cy="52" r="3"/>
  </g>

  <!-- lid, popped off to the side -->
  <g transform="rotate(-24 176 78)">
    <rect x="140" y="62" width="94" height="30" rx="10" fill="url(#goLid)"/>
    <rect x="176" y="62" width="18" height="30" fill="url(#goRibbon)"/>
  </g>

  <!-- box body, open -->
  <rect x="54" y="118" width="132" height="86" rx="15" fill="url(#goFace)"/>
  <rect x="107" y="118" width="26" height="86" fill="url(#goRibbon)"/>

  <!-- draped ribbon tails -->
  <path d="M70 118 C56 140 58 168 46 190" stroke="url(#goRibbon)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M170 118 C184 140 182 168 194 190" stroke="url(#goRibbon)" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
